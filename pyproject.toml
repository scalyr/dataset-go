# Python dev tools only: this is not a Python package. Every tool that
# pre-commit runs is pinned here (and, with hashes, in uv.lock) so that local
# runs and CI use identical versions and Dependabot's `uv` ecosystem bumps them.
# Go tools are pinned the same way in tools/go.mod.
[project]
name = "dataset-go-dev-tools"
version = "0"
requires-python = ">=3.15"

[dependency-groups]
dev = [
  "actionlint-py>=1.7",
  "check-jsonschema>=0.33",
  "pre-commit>=4.3",
  "pre-commit-hooks>=6.0",
  "shellcheck-py>=0.11",
  "zizmor>=1.16",
]

[tool.uv]
package = false

# The repo is public: lock against PyPI, never a private mirror from a
# developer's own uv config, or CI and contributors could not install it.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
