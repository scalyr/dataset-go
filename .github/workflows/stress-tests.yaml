name: Stress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'

permissions:
  actions: write  # Needed for skip-duplicate-jobs job
  contents: read

jobs:
  # Special job which automatically cancels old runs for the same branch, prevents runs for the
  # same file set which has already passed, etc.
  pre_job:
    name: Skip Duplicate Jobs Pre Job
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ github.token }}

  # Computes the Go versions at run time (go.mod floor up to the latest supported
  # release, see scripts/go-versions.sh), so nothing can drift from go.mod.
  versions:
    name: Resolve Go versions
    runs-on: ubuntu-latest
    outputs:
      primary: ${{ steps.read.outputs.primary }}
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        shell: bash  # adds -o pipefail, so a script failure is not masked by tee
        run: ./scripts/go-versions.sh | tee -a "$GITHUB_OUTPUT"

  stress-tests:
    strategy:
      matrix:
        go: ${{ fromJSON(needs.versions.outputs.matrix) }}
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [pre_job, versions]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' || github.ref_name == 'main' }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run Stress Test - Each bucket used once
        run: |
          ./scripts/run-stress-test.sh 10000 10000
      - name: Run Stress Test - Max congestion
        run: |
          ./scripts/run-stress-test.sh 10000 -1
      - uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-${{ matrix.go }}
          path: examples/stress/*.log

  # Stable check name for branch protection: the matrix job names embed Go
  # versions, which change whenever a Go release ships or go.mod is raised.
  result:
    name: Stress Tests result
    if: always()
    needs: [pre_job, versions, stress-tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSIONS: ${{ needs.versions.result }}
          JOB: ${{ needs.stress-tests.result }}
          SKIPPED_AS_DUPLICATE: ${{ needs.pre_job.outputs.should_skip }}
        run: |
          echo "versions=${VERSIONS} stress-tests=${JOB} skipped_as_duplicate=${SKIPPED_AS_DUPLICATE}"
          [[ "${VERSIONS}" == success ]] || exit 1
          [[ "${JOB}" == success || ( "${JOB}" == skipped && "${SKIPPED_AS_DUPLICATE}" == true ) ]]
