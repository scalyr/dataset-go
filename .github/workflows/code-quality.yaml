name: Check code quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  # Special job which automatically cancels old runs for the same branch, prevents runs for the
  # same file set which has already passed, etc.
  pre_job:
    name: Skip Duplicate Jobs Pre Job
    runs-on: ubuntu-latest
    permissions:
      actions: write  # cancels superseded runs of this workflow
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          cancel_others: 'true'
          github_token: ${{ github.token }}

  # Computes the Go versions at run time (go.mod floor up to the latest supported
  # release, see scripts/go-versions.sh), so nothing can drift from go.mod.
  versions:
    name: Resolve Go versions
    runs-on: ubuntu-latest
    outputs:
      primary: ${{ steps.read.outputs.primary }}
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        shell: bash  # adds -o pipefail, so a script failure is not masked by tee
        run: ./scripts/go-versions.sh | tee -a "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: [pre_job, versions]
    if: ${{ needs.pre_job.outputs.should_skip != 'true' || github.ref_name == 'main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test scripts/go-versions.sh
        run: ./scripts/go-versions_test.sh
      - name: Test scripts/run-stress-test.sh
        run: ./scripts/run-stress-test_test.sh
      # Python and every Python tool come from uv.lock (pyproject.toml).
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ needs.versions.outputs.primary }}
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
            examples/**/go.sum
      # Need Go and run before `go mod vendor`; the seam cases copy the module.
      - name: Test release scripts
        run: |
          ./scripts/next-release_test.sh
          ./scripts/bump-version_test.sh
      # Needs Go: its seam case runs the real `go mod edit`.
      - name: Test scripts/test-otel-contrib.sh
        run: ./scripts/test-otel-contrib_test.sh
      - name: Check for known vulnerabilities
        run: make govulncheck
      - name: Test scripts/install-dev-tools.sh and scripts/go-tool.sh
        run: |
          ./scripts/install-dev-tools_test.sh
          ./scripts/go-tool_test.sh
      - name: Install pinned dev tools and the git hook
        run: ./scripts/install-dev-tools.sh
      - name: Run go mod vendor
        run: |
          go mod vendor
      - name: Run pre-commit
        run: make pre-commit-run
      - name: Code coverage
        timeout-minutes: 15
        run: |
          make coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
      - name: Build Examples
        run: |
          make build-examples
      - name: Check SSL Certificates
        timeout-minutes: 10
        run: |
          make test-ssl-certificates

  # Stable check name for branch protection, matching the "... result" gates of
  # the unit and stress test workflows (where the matrix job names change).
  result:
    name: Code Quality result
    if: always()
    needs: [pre_job, versions, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          VERSIONS: ${{ needs.versions.result }}
          JOB: ${{ needs.build.result }}
          SKIPPED_AS_DUPLICATE: ${{ needs.pre_job.outputs.should_skip }}
        run: |
          echo "versions=${VERSIONS} build=${JOB} skipped_as_duplicate=${SKIPPED_AS_DUPLICATE}"
          [[ "${VERSIONS}" == success ]] || exit 1
          [[ "${JOB}" == success || ( "${JOB}" == skipped && "${SKIPPED_AS_DUPLICATE}" == true ) ]]
