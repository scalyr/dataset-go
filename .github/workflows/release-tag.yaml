name: Release tag

# Creates the next release for a commit on main that passed Unit Tests, when it
# changes something consumers get: non-test code or a linked dependency (see
# scripts/next-release.sh for the exact rules). That is the next patch, unless
# pkg/version/version.go already asks for a higher version. It commits the new
# version into pkg/version/version.go and tags that commit.
#
# Triggered by Unit Tests rather than `push`, so only tested commits are tagged
# and so Dependabot merges are covered: auto-merge.yaml merges with
# GITHUB_TOKEN, which fires no push workflows, but the nightly scheduled Unit
# Tests run on main picks those up.
#
# Needs the RELEASE_TOKEN secret: a PAT with contents: write whose owner can
# bypass the branch protection on main (see README "Releases"). GITHUB_TOKEN
# cannot push past the required review.

on:
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read  # workflow_dispatch: look up the Unit Tests result for the commit
  contents: read

# Never run two releases at once: both would compute the same next tag.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  release:
    name: Tag release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "schedule"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # A manual run has no Unit Tests run attached: require one for this commit,
      # so dispatch cannot tag an untested or failing commit.
      - name: Check Unit Tests passed
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/unit-tests.yaml/runs?head_sha=${SHA}&status=success" --jq .total_count)
          if [[ "${passed}" == 0 ]]; then
            echo "::error::Unit Tests has not passed for ${SHA}; wait for it or re-run it first"
            exit 1
          fi

      # Default token, not persisted: RELEASE_TOKEN is only needed (and only
      # checked) when there is something to release, see the push step.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0  # all history and tags: the diff is taken from the latest tag
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - id: next
        name: Decide whether to release
        shell: bash  # adds -o pipefail, so a script failure is not masked by tee
        run: ./scripts/next-release.sh "${SHA}" | tee -a "$GITHUB_OUTPUT"

      - id: push
        name: Commit version and push tag
        if: steps.next.outputs.release == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
          REASON: ${{ steps.next.outputs.reason }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "::error::RELEASE_TOKEN secret is not set (see README \"Releases\")"
            exit 1
          fi
          remote="https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Main moved on since the tested commit: tag nothing rather than tag
          # untested commits. The newer commit's own run releases everything.
          git fetch --quiet "${remote}" main
          if [[ "$(git rev-parse FETCH_HEAD)" != "${SHA}" ]]; then
            echo "::notice::main moved past ${SHA}; leaving ${TAG} to the run for the newer commit"
            exit 0
          fi

          ./scripts/bump-version.sh "${TAG#v}" "$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Nothing to commit when version.go already names this release (a
          # requested minor/major on the same day): tag the tested commit itself.
          if ! git diff --quiet -- pkg/version/version.go; then
            git commit --quiet -m "chore(release): ${TAG}" -m "Reason: ${REASON}" pkg/version/version.go
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          # Atomic: the version commit never lands on main without its tag.
          # Not forced: rejected if main moved in the meantime; re-running is safe.
          git push --atomic "${remote}" "HEAD:refs/heads/main" "refs/tags/${TAG}"
          echo "pushed=true" >>"$GITHUB_OUTPUT"
          echo "::notice::released ${TAG} (${REASON})"

      # Lets pkg.go.dev see the tag right away; it would find it eventually anyway.
      - name: Announce to the Go module proxy
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: GOPROXY=https://proxy.golang.org go list -m "$(go list -m)@${TAG}"
